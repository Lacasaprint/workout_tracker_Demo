    case 'meal:docopy': { const from=hb.dataset.from,to=hb.dataset.to; S().mealPlan[to]=deepClone(S().mealPlan[from]); save(); closeModal(); render(); toast(DOW_LAB[from]+' copied to '+DOW_LAB[to]); break; }
    case 'meal:clearday': { const day=hb.dataset.day;
      confirmBox({title:'Clear '+DOW_LAB[day]+'?',text:'All planned meals for this day will be removed.',ok:'Clear the day',danger:true,onOk:()=>{ MEALS.forEach(m=>{S().mealPlan[day][m[0]]=[];}); save(); render(); toast(DOW_LAB[day]+' cleared — space is nice too'); }});
      break;
    }
    case 'meal:ing': addIngredients(hb.dataset.day); break;
    case 'meal:print': mealPrint(); break;
    /* habits */
    case 'hab:month': { const d=parseInt(hb.dataset.d,10); let m=ui.habMonth.m+d, y=ui.habMonth.y;
      if(m<0){m=11;y--;} if(m>11){m=0;y++;} ui.habMonth={y,m}; render(); break; }
    case 'hab:restmode': ui.restMode=!ui.restMode; render(); break;
    case 'hcell': applyHabitTick(hb.dataset.h,hb.dataset.d,ui.restMode); break;
    case 'h:add': habitModal(null); break;
    case 'h:edit': habitModal(id); break;
    case 'h:pickicon': document.getElementById('hbIcon').value=hb.dataset.i;
      document.querySelectorAll('.c-ic').forEach(b=>b.classList.toggle('on',b.dataset.i===hb.dataset.i)); break;
    case 'h:pickcolor': document.getElementById('hbColor').value=hb.dataset.c;
      document.querySelectorAll('.c-sw').forEach(b=>b.classList.toggle('on',b.dataset.c===hb.dataset.c)); break;
    case 'h:up': case 'h:down': {
      const hs=S().habits, i=hs.findIndex(x=>x.id===id), j=act==='h:up'?i-1:i+1;
      if(i>-1&&j>=0&&j<hs.length){ const t=hs[i]; hs[i]=hs[j]; hs[j]=t; save(); render(); }
      break;
    }
    case 'h:del': {
      const i=S().habits.findIndex(x=>x.id===id);
      if(i>-1){ const h=S().habits[i];
        confirmBox({title:'Delete "'+h.name+'"?',text:'Its history goes too. The habit will not take it personally.',ok:'Delete',danger:true,onOk:()=>{
          S().habits.splice(i,1); Object.keys(S().habitLog).forEach(d=>{ delete S().habitLog[d][id]; }); save(); render(); toast('Habit removed — make room for what matters');
        }}); }
      break;
    }
    /* progress */
    case 'meas:focus': measModal(); break;
    case 'meas:del': {
      const i=S().measurements.findIndex(x=>x.id===id);
      if(i>-1){ const m=S().measurements[i]; S().measurements.splice(i,1); save(); render();
        pushUndo('Measurement entry deleted',()=>{ S().measurements.push(m); S().measurements.sort((a,b)=>a.date<b.date?-1:1); save(); render(); }); }
      break;
    }
    case 'photo:pose': ui.photoPose=hb.dataset.p; render(); break;
    case 'photo:upload': document.getElementById('filePhoto').click(); break;
    case 'photo:del': {
      const i=S().photos.findIndex(x=>x.id===id);
      if(i>-1){ const p=S().photos[i]; S().photos.splice(i,1); save(); render();
        pushUndo('Photo deleted',()=>{ S().photos.push(p); save(); render(); }); }
      break;
    }
    case 'photo:view': lightboxOpen(id); break;
    case 'lightbox:close': document.getElementById('lightbox').classList.remove('open'); break;
    /* grocery */
    case 'gro:edit': groModal(id); break;
    case 'gro:del': {
      const i=S().grocery.findIndex(x=>x.id===id);
      if(i>-1){ const x=S().grocery[i]; S().grocery.splice(i,1); save(); render();
        pushUndo('"'+x.name+'" removed',()=>{ S().grocery.push(x); save(); render(); }); }
      break;
    }
    case 'gro:clearbought': {
      const bought=S().grocery.filter(x=>x.bought);
      if(!bought.length) break;
      confirmBox({title:'Clear bought items?',text:fmtInt(bought.length)+' item(s) head to the void. You can undo right after.',ok:'Clear',danger:true,onOk:()=>{
        S().grocery=S().grocery.filter(x=>!x.bought); save(); render();
        pushUndo('Bought items cleared',()=>{ S().grocery=S().grocery.concat(bought); save(); render(); });
      }});
      break;
    }
    case 'gro:fromplan': {
      let added=0;
      DAY_KEYS.forEach(k=>MEALS.forEach(m=>mealPlanDay(k)[m[0]].forEach(it=>{
        (it.ing||'').split(',').forEach(s=>{ const v=s.trim(); if(!v) return;
          const mm=v.match(/^(\d+(?:[.,]\d+)?)\s*([a-zA-Z]+)?\s+(.+)$/);
          const nm=(mm?mm[3]:v).trim();
          if(S().grocery.some(g=>g.name.toLowerCase()===nm.toLowerCase())) return;
          S().grocery.push({id:uid(),name:nm,qty:mm?mm[1]:'',unit:mm?(mm[2]||''):'',cat:guessCat(nm),bought:false}); added++;
        });
      })));
      save(); render();
      toast(added? added+' ingredient'+(added===1?'':'s')+' added — duplicates skipped' : 'The list already has everything from the plan');
      break;
    }
    case 'gro:copy': {
      const txt=groText();
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast('List copied — happy shopping'),()=>fallbackCopy(txt));
      else fallbackCopy(txt);
      break;
    }
    case 'gro:print': groPrint(); break;
    /* settings */
    case 'set:unitw': S().settings.unitW=hb.dataset.u; save(); render(); break;
    case 'set:unitl': S().settings.unitL=hb.dataset.u; save(); render(); break;
    case 'set:theme': S().settings.theme=hb.dataset.u; document.documentElement.setAttribute('data-theme',S().settings.theme); save(); render(); break;
    case 'set:weekstart': S().settings.weekStart=parseInt(hb.dataset.u,10); save(); render(); break;
    case 'set:simple': S().settings.simple=!S().settings.simple; save(); render(); toast(S().settings.simple?'Simple mode — only the essentials':'Everything mode — all screens back'); break;
    case 'set:avatar': document.getElementById('fileAvatar').click(); break;
    case 'data:demo': confirmBox({title:'Load demo data?',text:'It replaces what is here with 12 weeks of sample life — great for exploring.',ok:'Load demo',onOk:()=>loadSampleData()}); break;
    case 'data:fresh': confirmBox({title:'Start fresh?',text:'Your name and theme stay; everything else makes way.',ok:'Start fresh',danger:true,onOk:()=>freshStart(true)}); break;
    case 'data:export': exportJSON(); break;
    case 'data:import': document.getElementById('fileRestore').click(); break;
    case 'data:csv': exportCSV(hb.dataset.k); break;
    case 'data:clear': confirmBox({title:'Clear all data?',text:'This really removes everything on this device. Export a backup first if in doubt.',ok:'Continue',danger:true,onOk:()=>{
        confirmBox({title:'Last check — clear EVERYTHING?',text:'Weight, workouts, meals, photos: gone. There is no undo.',ok:'Yes, clear it all',danger:true,onOk:()=>{
          try{ localStorage.removeItem(STORE_KEY); }catch(err){}
          ST=normalize(null); persistNow(); render(); toast('All clear. Day one — again, kindly.');
        }});
      }}); break;
    case 'fl:demo': closeModal(); loadSampleData(); break;
    case 'fl:fresh': closeModal(); S().meta.firstLaunch=false; persistNow(); toast('A fresh start. One small step is enough today.'); break;
  }
});
function fallbackCopy(txt){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('List copied'); }catch(e){ toast('Copy failed — select the text manually'); }
  ta.remove();
}
document.addEventListener('input',e=>{
  if(e.target.id==='palInput'){ ui.palQ=e.target.value; ui.palSel=0; renderPal(); }
  else if(e.target.id==='tpSearch'){
    const q=e.target.value;
    const groups={};
    S().exercises.filter(x=>!q||x.name.toLowerCase().includes(q.toLowerCase())).slice(0,40).forEach(x=>{ (groups[x.group]=groups[x.group]||[]).push(x); });
    document.getElementById('tplPick').innerHTML=Object.keys(groups).map(g=>'<details'+(q?' open':'')+'><summary>'+esc(g)+'</summary>'
      +groups[g].map(x=>'<button class="ex-item" type="button" data-action="tpl:addex" data-name="'+esc(x.name)+'" data-type="'+x.type+'">'+ic('plus')+esc(x.name)+'</button>').join('')+'</details>').join('')
      ||'<p class="muted small" style="padding:8px">No match — you can type a custom name in the row above instead.</p>';
  }
  else if(e.target.id==='exSearch'){ document.getElementById('exLib').innerHTML=exLibHTML(e.target.value); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fileAvatar'){ if(t.files&&t.files[0]) resizeImage(t.files[0],d=>{ S().settings.photo=d; save(); render(); toast('Profile photo updated'); }); t.value=''; }
  else if(t.id==='filePhoto'){ if(t.files&&t.files[0]){
      const date=(document.getElementById('phDate')||{}).value||todayISO();
      resizeImage(t.files[0],d=>{ S().photos.push({id:uid(),date,pose:ui.photoPose,dataUrl:d,note:''}); save(); render(); toast(ui.photoPose+' photo saved — only on this device'); });
    } t.value=''; }
  else if(t.id==='fileRestore'){
    const f=t.files&&t.files[0];
    if(f){ const r=new FileReader();
      r.onload=ev=>{ try{
          const obj=JSON.parse(ev.target.result);
          if(!validateImport(obj)) throw new Error('bad');
          const n=normalize(obj);
          confirmBox({title:'Import this backup?',text:'Contains '+fmtInt(n.weights.length)+' weights, '+fmtInt(n.sessions.length)+' sessions, '+fmtInt(n.foods.length)+' food logs, '+fmtInt(n.photos.length)+' photos. It replaces current data.',ok:'Import',onOk:()=>{
            ST=n; persistNow(); render(); toast('Backup imported — welcome back');
          }});
        }catch(err){ toast('That file is not a valid backup — export a fresh one from Settings.'); } };
      r.readAsText(f);
    } t.value='';
  }
  else if(t.dataset.change==='gro:tick'){ const x=S().grocery.find(g=>g.id===t.dataset.id); if(x){ x.bought=t.checked; save(); render(); if(t.checked) toast('"'+x.name+'" in the basket'); } }
  else if(t.dataset.change==='cmp'){ ui.cmpA=(document.getElementById('cmpA')||{}).value||''; ui.cmpB=(document.getElementById('cmpB')||{}).value||''; render(); }
  else if(t.dataset.set){ applySet(t.dataset.set,t.value); }
});
function applySet(key,val){
  const st=S().settings;
  if(key==='name') st.name=val.trim();
  else if(key==='startWeight') st.startWeight=parseFloat(val)||st.startWeight;
  else if(key==='targetWeight') st.targetWeight=parseFloat(val)||st.targetWeight;
  else if(key==='weeklyGoal') st.weeklyGoal=clamp(parseInt(val,10)||4,1,14);
  else if(key==='kcalTarget') st.kcalTarget=parseInt(val,10)||st.kcalTarget;
  else if(key==='macroP') st.macro.p=clamp(parseFloat(val)||0,0,100);
  else if(key==='macroC') st.macro.c=clamp(parseFloat(val)||0,0,100);
  else if(key==='macroF') st.macro.f=clamp(parseFloat(val)||0,0,100);
  else if(key==='bigLabel') st.bigLabel=val;
  save();
  clearTimeout(applySet._t); applySet._t=setTimeout(()=>{ render(); toast('Saved'); },500);
}
document.addEventListener('submit',e=>{
  const f=e.target; if(!f.dataset.form) return;
  e.preventDefault();
  const data=Object.fromEntries(new FormData(f));
  const fn=FORMS[f.dataset.form];
  if(fn) fn(data,f);
});
const FORMS={
  weightAdd(d){
    if(!d.date||!d.val){ showErr('wErr','A date and a number, that is all we need.'); return; }
    const kg=toKg(parseFloat(d.val));
    if(!(kg>0)){ showErr('wErr','That weight looks shy — try a positive number.'); return; }
    quickWeight(kg,d.date);
    if(d.note) S().weights.find(w=>w.date===d.date).note=d.note.trim();
    save(); render();
  },
  weightSave(d,f){
    if(!d.date||!d.val){ toast('A date and a number, that is all we need.'); return; }
    const w=S().weights.find(x=>x.id===f.dataset.id);
    if(w){ w.date=d.date; w.kg=Math.round(toKg(parseFloat(d.val))*10)/10; w.note=d.note||''; S().weights.sort((a,b)=>a.date<b.date?-1:1); save(); render(); }
    closeModal(); toast('Entry updated');
  },
  quickKcal(d){
    const k=parseInt(d.kcal,10);
    if(!(k>0)){ toast('How many calories? A number helps.'); return; }
    quickKcal(k,d.meal);
  },
  foodAdd(d){
    if(!d.name||!(parseFloat(d.kcal)>0)){ toast('A name and calories make a food.'); return; }
    S().foods.push({id:uid(),date:ui.calDay,meal:d.meal||'snacks',name:d.name.trim(),kcal:Math.round(parseFloat(d.kcal)),p:parseFloat(d.p)||0,c:parseFloat(d.c)||0,f:parseFloat(d.f)||0});
    save(); render(); closeModal(); toast('"'+d.name.trim()+'" logged');
  },
  kcalc(d){
    const w=parseFloat(d.weightKg)||80,h=parseFloat(d.heightCm)||175,a=parseInt(d.age,10)||30;
    let bmr=10*w+6.25*h-5*a+(d.sex==='male'?5:-161);
    let tdee=bmr*(parseFloat(d.activity)||1.375);
    if(d.goal==='lose') tdee-=400; if(d.goal==='gain') tdee+=300;
    S().settings.sex=d.sex; S().settings.age=a; S().settings.heightCm=h; S().settings.activity=parseFloat(d.activity)||1.375; S().settings.goal=d.goal;
    S().settings.kcalTarget=Math.round(tdee/10)*10;
    save(); render(); closeModal();
    toast('Target set to '+fmtKcal(S().settings.kcalTarget)+' — adjust anytime');
  },
  tplSave(d,f){
    if(!d.name||!d.name.trim()){ showErr('tplErr','Give it a name — even "Friday fun" counts.'); return; }
    const rows=[...document.querySelectorAll('#tplRows .tpl-row')].map(r=>({
      name:r.querySelector('[data-f="name"]').value.trim(),
      type:r.dataset.type||'strength',
      sets:parseInt(r.querySelector('[data-f="sets"]').value,10)||0,
      reps:parseInt(r.querySelector('[data-f="reps"]').value,10)||0,
      weight:parseFloat(r.querySelector('[data-f="weight"]').value)||0,
      minutes:parseFloat(r.querySelector('[data-f="minutes"]').value)||0,
      rest:parseInt(r.querySelector('[data-f="rest"]').value,10)||0
    })).filter(x=>x.name);
    if(!rows.length){ showErr('tplErr','Add at least one exercise — search below and tap to add.'); return; }
    if(TPL_DRAFT&&TPL_DRAFT.id){ const t=S().templates.find(x=>x.id===TPL_DRAFT.id);
      Object.assign(t,{name:d.name.trim(),type:d.type,note:d.note,exercises:rows});
    } else S().templates.push({id:uid(),name:d.name.trim(),type:d.type,note:d.note||'',exercises:rows});
    save(); closeModal(); render(); toast('Template saved — ready when you are');
  },
  exCustom(d){
    if(!d.name||!d.name.trim()){ toast('What should we call it?'); return; }
    S().exercises.push({id:uid(),name:d.name.trim(),group:d.group||'Other',type:d.group==='Cardio'?'cardio':d.group==='Mobility'?'mobility':'strength'});
    save(); render(); toast('"'+d.name.trim()+'" joined the library');
  },
  mealSave(d,f){
    if(!d.name||!d.name.trim()){ toast('A name makes it a meal.'); return; }
    const day=f.dataset.day, slot=f.dataset.slot, id=f.dataset.id;
    const arr=S().mealPlan[day][slot];
    const obj={name:d.name.trim(),kcal:parseFloat(d.kcal)||0,p:parseFloat(d.p)||0,c:parseFloat(d.c)||0,f:parseFloat(d.f)||0,ing:d.ing||''};
    if(id){ const it=arr.find(x=>x.id===id); Object.assign(it,obj); }
    else arr.push(Object.assign({id:uid()},obj));
    save(); render(); closeModal(); toast('Planned for '+DOW_LAB[day]+' '+MEAL_LAB[slot]);
  },
  measSave(d){
    if(!d.date){ toast('Which day is this from?'); return; }
    const num=v=>v===''||v==null?null:parseFloat(v);
    const m={id:uid(),date:d.date,
      weight:d.weight!==''?toKg(parseFloat(d.weight)):null,
      chest:d.chest!==''?toCm(parseFloat(d.chest)):null,
      waist:d.waist!==''?toCm(parseFloat(d.waist)):null,
      hips:d.hips!==''?toCm(parseFloat(d.hips)):null,
      arms:d.arms!==''?toCm(parseFloat(d.arms)):null,
      thighs:d.thighs!==''?toCm(parseFloat(d.thighs)):null,
      bf:num(d.bf)};
    const allNull=MEAS_FIELDS.every(f=>m[f[0]]==null);
    if(allNull){ toast('Measure at least one number — the rest can wait.'); return; }
    const ex=S().measurements.find(x=>x.date===d.date);
    if(ex) Object.assign(ex,m); else S().measurements.push(m);
    S().measurements.sort((a,b)=>a.date<b.date?-1:1);
    if(m.weight!=null&&!S().weights.some(w=>w.date===d.date)) S().weights.push({id:uid(),date:d.date,kg:m.weight,note:'from measurements'});
    S().weights.sort((a,b)=>a.date<b.date?-1:1);
    save(); render(); closeModal(); toast('Measurements saved');
  },
  habitSave(d,f){
    if(!d.name||!d.name.trim()){ toast('Give the habit a name.'); return; }
    const obj={name:d.name.trim(),target:Math.max(1,parseInt(d.target,10)||1),unit:(d.unit||'').trim(),icon:document.getElementById('hbIcon').value,color:document.getElementById('hbColor').value};
    if(f.dataset.id){ const h=habitById(f.dataset.id); Object.assign(h,obj); }
    else S().habits.push(Object.assign({id:uid()},obj));
    save(); render(); closeModal(); toast('Habit saved — small is mighty');
  },
  groAdd(d){
    if(!d.name||!d.name.trim()){ toast('What are we buying?'); return; }
    S().grocery.push({id:uid(),name:d.name.trim(),qty:d.qty||'',unit:d.unit||'',cat:d.cat||'Other',bought:false});
    save(); render(); toast('"'+d.name.trim()+'" on the list');
  },
  groSave(d,f){
    const x=S().grocery.find(g=>g.id===f.dataset.id);
    if(x){ x.name=d.name.trim()||x.name; x.qty=d.qty||''; x.unit=d.unit||''; x.cat=d.cat||x.cat; save(); render(); }
    closeModal(); toast('Item updated');
  }
};
function showErr(id,msg){
  const el=document.getElementById(id);
  if(el){ el.querySelector('span').textContent=msg; el.classList.add('show'); }
  else toast(msg);
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('palette').classList.contains('open')?closePalette():openPalette(); return; }
  if(e.key==='Escape'){
    if(document.getElementById('palette').classList.contains('open')) closePalette();
    else if(document.getElementById('modal').classList.contains('open')) closeModal();
    else if(document.getElementById('lightbox').classList.contains('open')) document.getElementById('lightbox').classList.remove('open');
    else if(document.getElementById('focusOv').classList.contains('open')) document.getElementById('focusOv').classList.remove('open');
    else closeSheet();
    closeHelpPop();
    return;
  }
  if(document.getElementById('palette').classList.contains('open')){
    if(e.key==='ArrowDown'){ e.preventDefault(); ui.palSel=Math.min(ui.palItems.length-1,ui.palSel+1); renderPal(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); ui.palSel=Math.max(0,ui.palSel-1); renderPal(); }
    else if(e.key==='Enter'){ e.preventDefault(); palRun(ui.palSel); }
  }
});
document.addEventListener('click',e=>{ if(e.target.closest('.avatar-edit')) document.getElementById('fileAvatar').click(); },true);

/* ---------- boot ---------- */
function hydrateIcons(){
  document.querySelectorAll('[data-ic]').forEach(el=>{ el.innerHTML=ic(el.dataset.ic); el.removeAttribute('data-ic'); });
}
function init(){
  loadState();
  document.documentElement.setAttribute('data-theme',S().settings.theme||'light');
  document.body.classList.toggle('help-off',!S().settings.help);
  hydrateIcons();
  window.addEventListener('hashchange',routeTo);
  routeTo();
  if(S().meta.firstLaunch){
    openModal('<div style="text-align:center">'+emptyArt('dumbbell')
      +'<h3>Welcome to your gentle tracker</h3>'
      +'<p class="msub">One big number, one next thing, zero guilt. Everything stays on this device — no account, no server, no noise.</p>'
      +'<div class="mrow" style="justify-content:center"><button class="btn soft" data-action="fl:demo">'+ic('sparkle')+'Explore with demo data</button>'
      +'<button class="btn primary" data-action="fl:fresh">'+ic('arrowR')+'Begin fresh</button></div></div>');
  }
}
init();
</script>
